name: 🏗️ Build @last9/openapm

on:
  push:
    branches:
      - '*'

jobs:
  release:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The patched floor of each line in package.json engines.node (#58);
        # tests/node-version.test.ts keeps them equal.
        node-version: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 🔐 TLS probe (eMudhra chain must be rejected)
        run: node scripts/tls-probe.mjs
      - uses: shogo82148/actions-setup-mysql@v1.23.0
        with:
          mysql-version: '8.0'

      - name: Test MySQL Connection
        run: mysql -h localhost -u root -e 'SELECT version()'

      - name: Create test DB
        run: mysql -h localhost -u root -e 'CREATE DATABASE test_db'

      - name: 🧶 Get NPM cache
        uses: actions/cache@v3
        id: cache-npm
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{
            hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: 📦 Install dependencies
        run: npm install --frozen-lockfile

      - name: 📦 Install Playwright Deps
        run: npx playwright install --with-deps

      - name: 🧪 Test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: test_db
          DB_USER: root
          CI: true
        run: npm run test

      - name: 👷 Build
        run: npm run build
